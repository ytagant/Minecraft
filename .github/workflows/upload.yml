name: CraftVibe 1-Hour Auto Uploader

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  upload_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Create Google Credentials File
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDS" > service_account.json

      - name: Run CraftVibe Uploader
        env:
          MAIN_FOLDER_ID: ${{ secrets.MAIN_FOLDER_ID }}
        run: python uploader.py
        
