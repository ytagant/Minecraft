name: Pro YouTube Uploader

on:
  schedule:
    - cron: '50 * * * *'  # हर घंटे के 50वें मिनट पर चलेगा (जैसे 4:50, 5:50)
  workflow_dispatch:      # मैनुअल चलाने का बटन

concurrency: 
  group: youtube-auto-uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45  

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-liberation

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Create Secure Google Credentials
      env:
        JSON_CREDS: ${{ secrets.GOOGLE_CREDS }}
      run: |
        echo "$JSON_CREDS" > service_account.json
        chmod 600 service_account.json

    - name: Run Auto Uploader
      env:
        MAIN_FOLDER_ID: ${{ secrets.MAIN_FOLDER_ID }}
      run: python uploader.py

    - name: Security Cleanup
      if: always()
      run: rm -f service_account.json
      
